# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: Publish
on:
  workflow_dispatch:
    inputs:
      modtag:
        required: false
        description: "Mod Version: Create Nuclear for Release"
      name:
        required: true
        default: CreateNuclear
        description: Mod file name
      version: 
        required: false
        description: Mod version
      version-type:
        required: true
        default: alpha
        description: Version type
      changelog:
        required: true
        default: No change log
        description: Changelog for version

jobs:
  build:
    strategy:
      matrix:
        # Use these Java versions
        java: [
          21,    # Current Java LTS & minimum supported by Minecraft
        ]
        # and run on both Linux and Windows
        os: [[ubuntu-22.04]]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - name: checkout repository
        uses: actions/checkout@v3

      - name: validate gradle wrapper
        uses: gradle/wrapper-validation-action@v1
      
      - name: setup jdk ${{ matrix.java }}
        uses: actions/setup-java@v3
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
          
      - name: make gradle wrapper executable
        if: ${{ runner.os != 'Windows' }}
        run: chmod +x ./gradlew
      
      - name: Change version file
        if: ${{ github.event.inputs.modtag != '' }}
        run: |
          sed -i s/mod_version=.*/mod_version=${{github.event.inputs.modtag}}/ gradle.properties
          cat gradle.properties
      
      - name: build
        run: ./gradlew clean build
      
      - name: capture build artifacts
        # Always upload the jar on Linux/Java 21, whether or not this run is
        # tagging a release. This is what gives you a downloadable jar from a
        # plain "Run workflow" click with no inputs filled in.
        if: ${{ runner.os == 'Linux' && matrix.java == '21' }}
        uses: actions/upload-artifact@v3
        with:
          name: Artifacts
          path: build/libs/
      

      - name: Release
        if: ${{ github.event.inputs.modtag != '' }}
        id: release
        run: |
          git config --global user.email "github@valentinlamine.fr"
          git config --global user.name "CreateNuclear[bot]"
          git add gradle.properties
          git commit -m "change mod version"
          git tag -a ${{github.event.inputs.modtag}} -m "version du mod"
          echo "VERSION=${{github.event.inputs.modtag}}" >> "$GITHUB_OUTPUT"
      
      - name: Push Tag
        if: ${{ github.event.inputs.modtag != '' }}
        run: git push --follow-tags

      # Requires a CURSEFORGE_TOKEN secret under Settings > Secrets and
      # variables > Actions. Loader/game-version/dependency metadata below
      # is set for NeoForge 1.21.1, matching this repo's gradle.properties
      # (create_version 6.0.10-280, jei_version 19.43.0.390). Double-check
      # the JEI CurseForge file ID and the curseforge-id itself (989797 was
      # carried over from the Fabric repo's workflow — confirm it's the
      # right CurseForge project before relying on this step) before using
      # this for a real release.
      - name: Publish (CurseForge)
        if: ${{ github.event.inputs.modtag != '' && github.event.inputs.name != '' && github.event.inputs.version != '' && github.event.inputs.version-type != '' }}
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: 989797
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          name: ${{ github.event.inputs.name }} ${{ github.event.inputs.version }}
          version: ${{ github.event.inputs.version }}
          version-type: ${{ github.event.inputs.version-type }}
          changelog: ${{ github.event.inputs.changelog }}
          github-tag: ${{ github.event.inputs.version }}
          github-generate-changelog: true
          loaders: neoforge
          game-versions: 1.21.1
          files: build/libs/createnuclear-${{github.event.inputs.version}}-neoforge.jar
          dependencies: |
            neoforge@>=21.1.247(required)
            minecraft@~1.21.1(required)
            create@>=6.0.8(required)
            jei@19.43.0.390(optional)
          java: |
            Java 21
          
      
      - name: Create Release
        if: ${{ github.event.inputs.modtag != '' }}
        uses: ncipollo/release-action@v1
        with:
          generateReleaseNotes: true
          artifacts: "build/libs/*.jar"
          tag: ${{ steps.release.outputs.VERSION }}
